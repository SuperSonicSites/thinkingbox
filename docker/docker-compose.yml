services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ispbyaddress-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ispbyaddress
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/migrate:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ispbyaddress-redis
    ports:
      - "6379:6379"
    profiles:
      - full

volumes:
  pgdata:
