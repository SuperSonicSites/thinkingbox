name = "isp-by-address-canada"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
GEOCODE_PROVIDER = "GOOGLE"
MOCK_PLANS = "false"

# R2 bucket for pre-computed cell/ISP/plan data
[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "isp-data-canada"

# KV namespace for edge caching of R2 data
[[kv_namespaces]]
binding = "LOOKUP_CACHE"
id = "74e2c0c9b4814fdbaea3937794f08924"

# D1 database for write operations (discrepancy reports)
[[d1_databases]]
binding = "DISCREPANCY_DB"
database_name = "isp-discrepancy"
database_id = "e27a9db2-61f3-42a8-8a11-f7376e6f3a40"
